name: CI

# Runs once per pull request: this is the check that branch protection waits for
# before the merge button is enabled. No run after merge or on tags: with "branch
# must be up to date" on, the PR run already tested the exact result of the merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual run (Actions tab → CI → Run workflow)

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate kit content
        run: python scripts/validate.py

      - name: Unit tests (hook + installer)
        run: python -m unittest discover -s tests -v

      - name: ShellCheck
        run: shellcheck -S warning ./*.sh scripts/*.sh setup/k8s/*.sh sandbox/*.sh scenarios/*.sh

      - name: Installer dry run in a temp HOME
        run: |
          HOME="$(mktemp -d)" ./install.sh --dry-run --lang vi
